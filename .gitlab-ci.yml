stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

image: docker:25.0.3

services:
  - docker:25.0.3-dind

before_script:
  - docker info


validate:dockerfiles:
  stage: validate
  script:
    - docker build -t backend-validate ./backend
    - docker build -t frontend-validate ./frontend


build:images:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

    - docker build -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:latest

    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main


deploy:ec2:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan $DEPLOY_EC2_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh ubuntu@$DEPLOY_EC2_IP "
        cd ~/app && \
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && \
        docker compose pull && \
        docker compose up -d
      "

  only:
    - main